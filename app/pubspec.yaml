name: ca_part
description: "Ça part ! — jeux de soirée"
publish_to: 'none'

# versionName+versionCode Android / CFBundleShortVersionString+CFBundleVersion iOS.
# Incrémenter le build number à chaque dépôt sur les stores.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  shared_preferences: ^2.3.3
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/games/
    - assets/images/

  # TODO(DA): déclarer ici la police de la web app une fois les fichiers .ttf
  # déposés dans assets/fonts/, puis renseigner CapType.fontFamily.
  # fonts:
  #   - family: CaPart
  #     fonts:
  #       - asset: assets/fonts/CaPart-Regular.ttf
  #       - asset: assets/fonts/CaPart-Bold.ttf
  #         weight: 700

# Icônes de lancement Android/iOS : `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: assets/images/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0E0B1A"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png

# Écran de démarrage natif : `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#0E0B1A"
  image: assets/images/splash.png
  android_12:
    color: "#0E0B1A"
    image: assets/images/splash.png
  android: true
  ios: true
  web: false
