name: ca_part
description: "Ça Part — la carte qui fait partir la soirée."
publish_to: 'none'

# versionName+versionCode Android / CFBundleShortVersionString+CFBundleVersion iOS.
# Incrémenter le build number à chaque dépôt sur les stores.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  shared_preferences: ^2.3.3
  package_info_plus: ^9.0.0
  in_app_purchase: ^3.2.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/concepts/
    - assets/images/

  # TODO(DA): déclarer ici la police de la web app une fois les fichiers .ttf
  # déposés dans assets/fonts/, puis renseigner CapType.fontFamily.
  # fonts:
  #   - family: CaPart
  #     fonts:
  #       - asset: assets/fonts/CaPart-Regular.ttf
  #       - asset: assets/fonts/CaPart-Bold.ttf
  #         weight: 700

# Icônes de lancement Android/iOS : `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: assets/images/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#F4EDE3"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png

# Écran de démarrage natif : `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#F4EDE3"
  image: assets/images/splash.png
  android_12:
    color: "#F4EDE3"
    image: assets/images/splash.png
  android: true
  ios: true
  web: false
