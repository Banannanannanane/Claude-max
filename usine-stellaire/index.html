<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#10141b">
<title>Usine Stellaire — Colonie</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#10141b; --panel:#161c25; --panel2:#1d2530; --line:#2b3546;
  --tx:#e4eaf3; --mut:#8f9db0; --amber:#f2a13d; --amber-soft:#ffc46b;
  --good:#7ec97e; --bad:#e2705c; --sci:#5db3e8; --violet:#b08ae8;
  --r:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--tx);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45;
  user-select:none; -webkit-user-select:none; touch-action:none;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums}
#c3d{position:fixed;inset:0;display:block}

/* ---------- HUD haut ---------- */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding:calc(8px + env(safe-area-inset-top)) 10px 0;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
#hudRow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
#hudL{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
.stat{
  display:flex;align-items:center;gap:5px;
  background:rgba(18,23,31,.8);border:1px solid var(--line);border-radius:12px;
  padding:6px 11px 6px 9px;font-size:13px;font-weight:800;white-space:nowrap;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.stat .i{font-size:14px}
#hudBiome{color:var(--mut);font-weight:700;font-size:12px}
#hudBiome .i{font-size:13px}
#hudR{display:flex;gap:8px;pointer-events:auto;align-items:center}
#btnGuide.round{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:rgba(18,23,31,.8);border:1px solid #29465c;color:var(--sci);
  font-size:17px;font-weight:800;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}
#bagGauge{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;position:relative;
  background:conic-gradient(var(--amber) calc(var(--p,0)*1%), #2b3546 0);
  box-shadow:0 4px 14px rgba(0,0,0,.4);transition:background .3s;
}
#bagGauge.full{background:conic-gradient(var(--bad) 100%, var(--bad) 0)}
#bagInner{
  position:absolute;inset:3px;border-radius:50%;
  background:rgba(18,23,31,.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
}
#bagInner span{font-size:15px}
#bagInner b{font-size:11px;margin-top:1px}
#quest{
  align-self:stretch;display:flex;align-items:center;gap:10px;pointer-events:auto;
  background:rgba(18,23,31,.8);border:1px solid rgba(242,161,61,.35);border-radius:14px;
  padding:8px 12px;position:relative;overflow:hidden;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 16px rgba(0,0,0,.35);
}
#quest:active{background:rgba(28,35,47,.9)}
#questIco{font-size:20px;flex-shrink:0}
#quest .qmid{min-width:0;flex:1}
#quest .q1{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--amber-soft)}
#quest .q1 span{color:var(--mut);letter-spacing:0}
#quest .q2{font-size:12.5px;color:#dbe4ee;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#questBar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#2b3546}
#questBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2a13d,#ffc46b);transition:width .5s}
/* ---------- barre bas (dock) ---------- */
#botbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;
  display:flex;gap:4px;padding:6px;
  background:rgba(18,23,31,.85);border:1px solid var(--line);border-radius:20px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 26px rgba(0,0,0,.5);
}
#botbar button{
  background:transparent;border-radius:15px;padding:8px 0 7px;width:78px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:700;color:var(--mut);position:relative;transition:background .15s,color .15s;
}
#botbar button .ic{font-size:21px;line-height:1;transition:transform .15s}
#botbar button.on{background:rgba(242,161,61,.16);color:var(--amber-soft)}
#botbar button.on .ic{transform:translateY(-1px) scale(1.08)}
#botbar button .dot{position:absolute;top:4px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--amber);border:1.5px solid #12171f;display:none;animation:pulse 1.4s infinite}
#botbar button .dot.show{display:block}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}}
/* bouton contextuel central (MINER / recentrer) */
#ctxWrap{position:fixed;left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10;pointer-events:none}
#ctxBtn{
  pointer-events:auto;display:none;position:relative;overflow:visible;
  background:linear-gradient(180deg,#f2a13d,#d97f1e);color:#241503;
  font-weight:800;font-size:16px;letter-spacing:.05em;text-transform:uppercase;
  border-radius:99px;padding:14px 32px;box-shadow:0 4px 0 #8a4f10,0 6px 16px rgba(0,0,0,.4);
}
#ctxBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4f10}
#recenter{
  position:fixed;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:10;
  background:rgba(18,23,31,.9);border:1px solid var(--line);border-radius:50%;
  width:46px;height:46px;font-size:20px;display:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 14px rgba(0,0,0,.4);
}
/* mode construction */
#buildCtl{
  position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));
  display:none;justify-content:center;gap:10px;z-index:10;
}
#buildCtl button{
  background:rgba(22,28,37,.94);border:1px solid var(--line);border-radius:99px;
  padding:12px 22px;font-weight:800;font-size:15px;
}
#buildCtl #bOk{background:linear-gradient(180deg,#7ec97e,#4e9a4e);color:#0c1a0c;border:none}
#buildCtl #bOk:disabled{opacity:.4}
.flt{position:fixed;font-weight:800;color:var(--amber-soft);pointer-events:none;z-index:30;
 animation:fltUp .9s ease-out forwards;font-size:16px;text-shadow:0 1px 3px #000}
.flt.crit{color:#ffe08a;font-size:22px}
@keyframes fltUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-52px)}}

/* ---------- feuilles (bottom sheets) ---------- */
#sheetBack{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.45);display:none}
#sheetBack.show{display:block}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;
  background:var(--panel);border:1px solid var(--line);border-bottom:none;
  border-radius:18px 18px 0 0;max-height:72dvh;display:none;flex-direction:column;
}
#sheet.show{display:flex}
#sheetHead{display:flex;align-items:center;padding:12px 14px 8px;gap:8px}
#sheetHead h2{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-soft);flex:1}
#sheetHead button{font-size:20px;color:var(--mut);padding:0 6px}
#sheetBody{overflow-y:auto;padding:2px 12px calc(14px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:9px}
.card h3{font-size:14px;margin-bottom:4px}
.hint{font-size:12.5px;color:var(--mut)}
.cost{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12.5px;margin-top:5px}
.cost .no{color:var(--bad)} .cost .ok{color:var(--mut)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bcard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.bcard .t{font-weight:700;font-size:13.5px}
.bcard .ic{font-size:22px}
.bcard.locked{opacity:.45}
.rowbtn{
  width:100%;padding:10px 0;border-radius:9px;font-weight:700;font-size:13.5px;margin-top:8px;
  background:#2a2113;color:var(--amber-soft);border:1px solid #5a4116;
}
.rowbtn.blue{background:#152836;color:var(--sci);border-color:#29465c}
.rowbtn.green{background:#213121;color:var(--good);border-color:#3a5a3a}
.rowbtn.red{background:#312019;color:var(--bad);border-color:#5a2c24}
.rowbtn:disabled{opacity:.35}
.invrow{display:flex;align-items:center;gap:9px;padding:6px 2px;border-bottom:1px solid #232d3a;font-size:13.5px}
.invrow:last-child{border-bottom:none}
.invrow .n{flex:1;color:#c6d0dd}
.invrow b{font-size:14px}
.pbar{height:6px;border-radius:3px;background:#242e3c;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--violet)}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-size:14px}
.tgl button{width:52px;height:28px;border-radius:99px;background:#242e3c;position:relative;flex-shrink:0}
.tgl button i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#8f9db0;transition:left .2s}
.tgl button.on{background:#2a5a2a}
.tgl button.on i{left:27px;background:#7ec97e}
textarea#ioArea{
  width:100%;min-height:80px;background:#0b0e13;color:var(--tx);border:1px solid var(--line);
  border-radius:9px;padding:8px;font-size:12px;font-family:ui-monospace,monospace;
  user-select:text;-webkit-user-select:text;margin-top:8px;
}
/* ---------- modal / toast ---------- */
#modalBack{position:fixed;inset:0;background:rgba(5,8,12,.75);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
#modalBack.show{display:flex}
#modal{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:340px;width:100%;max-height:75dvh;overflow-y:auto}
#modal h3{font-size:15px;margin-bottom:8px;color:var(--amber-soft)}
#modal .body{font-size:13.5px;color:#c6d0dd;margin-bottom:14px}
#modal .body .g{display:flex;justify-content:space-between;padding:2px 0}
#modalBtns{display:flex;gap:8px}
#modalBtns button{flex:1;padding:10px 0;border-radius:9px;font-weight:700;font-size:13.5px;background:#2a2113;color:var(--amber-soft);border:1px solid #5a4116}
#modalBtns button.ghost{background:var(--panel);color:var(--mut);border-color:var(--line)}
#toast{
  position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-8px);
  background:#242e3c;border:1px solid var(--line);color:var(--tx);
  padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;
  opacity:0;transition:.25s;pointer-events:none;z-index:60;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#glErr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--mut);z-index:100;background:var(--bg)}
/* ---------- intro / cinématique ---------- */
#intro{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center;
  background:radial-gradient(ellipse at 50% 20%,rgba(28,38,58,.88),rgba(10,13,19,.94));
  transition:opacity .6s}
#intro.seeThrough{background:linear-gradient(180deg,rgba(10,13,19,.55) 0%,rgba(10,13,19,.1) 40%,rgba(10,13,19,.75) 78%)}
#intro.out{opacity:0;pointer-events:none}
#introCard{
  width:100%;max-width:480px;margin:0 14px calc(24px + env(safe-area-inset-bottom));
  background:rgba(18,23,31,.92);border:1px solid var(--line);border-radius:18px;padding:20px 18px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#introTx{font-size:15.5px;line-height:1.6;color:#dbe4ee;min-height:74px}
#introTx .eyebrow{display:block;font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--amber-soft);margin-bottom:8px}
#introBtns{display:flex;gap:9px;margin-top:16px}
#introBtns button{
  flex:1;padding:12px 0;border-radius:12px;font-weight:800;font-size:14px;
  background:linear-gradient(180deg,#f2a13d,#d97f1e);color:#241503;
}
#introBtns button.ghost{flex:.6;background:transparent;border:1px solid var(--line);color:var(--mut)}
.cLbl{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.cChips{display:flex;gap:7px;flex-wrap:wrap}
.cChips button{
  padding:8px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);
  font-size:13px;font-weight:700;color:var(--mut);
}
.cChips button.on{border-color:var(--amber);color:var(--tx);background:#2a2113}
.cChips button .sw{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:5px}

/* ---------- paysage (téléphone tourné) ---------- */
@media (orientation:landscape){
  #sheet{
    left:auto;right:0;top:0;bottom:0;margin:0;
    width:min(430px,55vw);height:100dvh;max-height:100dvh;
    border-radius:18px 0 0 18px;border-bottom:none;border-left:1px solid var(--line);
  }
  #topbar{padding-top:8px}
  #quest{align-self:flex-start;max-width:52vw}
  #ctxWrap{bottom:calc(86px + env(safe-area-inset-bottom))}
  #introCard{margin-bottom:14px;max-height:88dvh;overflow-y:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="glErr"><div>⚠️ Ton navigateur ne supporte pas WebGL,<br>impossible d'afficher le monde 3D.</div></div>

<div id="topbar">
  <div id="hudRow">
    <div id="hudL">
      <div class="stat"><span class="i">🧪</span><b id="hudSci" class="num">0</b></div>
      <div class="stat" id="hudFrag" style="display:none"><span class="i">✨</span><b id="hudFragN" class="num">0</b></div>
      <div class="stat" id="hudBiome"><span class="i" id="biomeIc">🌿</span><span id="biomeNm">Prairie</span></div>
    </div>
    <div id="hudR">
      <button id="btnGuide" class="round" aria-label="Guide">?</button>
      <div id="bagGauge"><div id="bagInner"><span>🎒</span><b id="hudInv" class="num">0</b></div></div>
    </div>
  </div>
  <div id="quest">
    <div id="questIco">🎯</div>
    <div class="qmid">
      <div class="q1">Objectif <span id="questN" class="num"></span></div>
      <div class="q2" id="questTx"></div>
    </div>
    <div id="questBar"><i id="questFill"></i></div>
  </div>
</div>

<div id="intro" style="display:none">
  <div id="introCard">
    <div id="introTx"></div>
    <div id="customBox" style="display:none">
      <div class="cLbl">Tête</div><div class="cChips headChips"></div>
      <div class="cLbl">Couleur</div><div class="cChips colorChips"></div>
    </div>
    <div id="introBtns"></div>
  </div>
</div>

<div id="ctxWrap"><button id="ctxBtn">⛏️ Miner</button></div>
<button id="recenter">🎯</button>
<div id="buildCtl">
  <button id="bCancel">✕</button>
  <button id="bRot">↻</button>
  <button id="bOk">✓ Construire</button>
</div>

<div id="botbar">
  <button id="tbBuild"><span class="ic">🔨</span>Construire<span class="dot"></span></button>
  <button id="tbInv"><span class="ic">🎒</span>Sac<span class="dot"></span></button>
  <button id="tbRsc"><span class="ic">🧪</span>Recherche<span class="dot" id="rscDot"></span></button>
  <button id="tbMenu"><span class="ic">☰</span>Menu<span class="dot"></span></button>
</div>

<div id="sheetBack"></div>
<div id="sheet">
  <div id="sheetHead"><h2 id="sheetTitle"></h2><button id="sheetClose">✕</button></div>
  <div id="sheetBody"></div>
</div>

<div id="modalBack"><div id="modal"><h3 id="modalTitle"></h3><div class="body" id="modalBody"></div><div id="modalBtns"></div></div></div>
<div id="toast"></div>

<script src="./three.bundle.js"></script>
<script>
'use strict';
/* =====================================================================
   USINE STELLAIRE : COLONIE — jeu de construction d'usine en 3D
   ===================================================================== */
if(!window.THREE){document.getElementById('glErr').style.display='flex';throw new Error('three manquant')}

/* ---------- objets ---------- */
const ITEMS={
  ironOre:    {n:'Minerai de fer',   ic:'⛏️', col:0x9fb6cc},
  copperOre:  {n:'Minerai de cuivre',ic:'🟠', col:0xd97a3e},
  coal:       {n:'Charbon',          ic:'⚫', col:0x33383f},
  stone:      {n:'Pierre',           ic:'🪨', col:0xb0aa9c},
  ironPlate:  {n:'Plaque de fer',    ic:'🔩', col:0xcdd8e4},
  copperPlate:{n:'Plaque de cuivre', ic:'🟧', col:0xe8935a},
  gear:       {n:'Engrenage',        ic:'⚙️', col:0x8b98a8},
  wire:       {n:'Câble',            ic:'🔌', col:0xd9a066},
  circuit:    {n:'Circuit',          ic:'💾', col:0x4fa96f},
  steel:      {n:'Acier',            ic:'⬜', col:0xdfe6ee},
  module:     {n:'Module logique',   ic:'🧠', col:0xb08ae8},
};
const DEPOSITS={
  iron:  {item:'ironOre',   n:'Gisement de fer',    col:0x8fa9c4},
  copper:{item:'copperOre', n:'Gisement de cuivre', col:0xc96f38},
  coal:  {item:'coal',      n:'Veine de charbon',   col:0x454c57},
  stone: {item:'stone',     n:'Carrière de pierre', col:0xa39e90},
};

/* ---------- bâtiments ---------- */
const BCAP=12; // capacité des tampons machine (par objet)
const BUILDINGS={
  drill:{nm:'Foreuse',ic:'⛏️',ds:'À poser sur un gisement. Extrait le minerai toute seule.',
    cost:{ironOre:10,stone:5},needsDeposit:true,mine:{t:2.5,q:1},cat:'ext'},
  furnace:{nm:'Four',ic:'🔥',ds:'Fond le minerai en plaques. Consomme du charbon.',
    cost:{stone:15,ironOre:8},cat:'fou',
    recipes:[{in:{ironOre:2,coal:1},out:{ironPlate:2},t:5},{in:{copperOre:2,coal:1},out:{copperPlate:2},t:5}]},
  gearw:{nm:'Atelier d’engrenages',ic:'⚙️',ds:'Usine des engrenages à partir de plaques de fer.',
    cost:{ironPlate:8,stone:5},cat:'asm',recipes:[{in:{ironPlate:2},out:{gear:1},t:3}]},
  wirem:{nm:'Tréfilerie',ic:'🔌',ds:'Étire les plaques de cuivre en câbles.',
    cost:{ironPlate:8,gear:4},cat:'asm',recipes:[{in:{copperPlate:1},out:{wire:2},t:3}]},
  circm:{nm:'Assembleur de circuits',ic:'💾',ds:'Assemble des circuits (fer + câbles).',
    cost:{ironPlate:15,gear:8},cat:'asm',recipes:[{in:{ironPlate:1,wire:3},out:{circuit:1},t:4}]},
  lab:{nm:'Laboratoire',ic:'🧪',ds:'Consomme engrenages et circuits, produit de la science.',
    cost:{ironPlate:15,gear:8,circuit:4},cat:'lab',recipes:[{in:{gear:1,circuit:1},out:{},sci:1,t:6}]},
  steelw:{nm:'Aciérie',ic:'🏭',ds:'Fond plaques + charbon en acier.',rsc:'steelTech',
    cost:{ironPlate:30,circuit:10},cat:'fou',recipes:[{in:{ironPlate:5,coal:2},out:{steel:1},t:8}]},
  modf:{nm:'Fabrique de modules',ic:'🧠',ds:'Le sommet de ta chaîne de production.',rsc:'moduleTech',
    cost:{steel:15,circuit:20},cat:'asm',recipes:[{in:{circuit:4,gear:2,steel:1},out:{module:1},t:10}]},
  belt:{nm:'Convoyeur',ic:'➡️',ds:'Transporte les objets d’une machine à l’autre. Oriente-le avec ↻.',
    cost:{ironPlate:1},belt:true,cat:'log'},
  chest:{nm:'Coffre',ic:'📦',ds:'Stocke jusqu’à 200 objets. Les machines adjacentes y déversent.',
    cost:{ironPlate:5,stone:5},chest:true,cap:200,cat:'log'},
  silo:{nm:'Silo à fusée',ic:'🚀',ds:'Alimente-le pour lancer la fusée (prestige !).',rsc:'rocketTech',

/* ---------- génération du monde (déterministe par graine) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const WORLD={terr:null,dep:null,bio:null,rng:null};
// terr : 0 sol, 1 rocher (bloquant), 2 arbre (bloquant), 3 montagne bord
const hash2=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296};
function genWorld(seed){
  const rng=mulberry32(seed); WORLD.rng=rng;
  const terr=new Uint8Array(MAP*MAP), dep=new Array(MAP*MAP).fill(null), bio=new Uint8Array(MAP*MAP);
  for(let y=0;y<MAP;y++)for(let x=0;x<MAP;x++){
    if(x<2||y<2||x>=MAP-2||y>=MAP-2)terr[y*MAP+x]=3;
  }
  // biomes : voronoï bruité, prairie garantie au centre (zone de départ)
  const seeds=[[MAP/2,MAP/2,0]];
  const pool=[1,2,3,1,2,3,0];
  for(let i=0;i<9;i++)seeds.push([4+rng()*(MAP-8),4+rng()*(MAP-8),pool[(rng()*pool.length)|0]]);
  for(let y=0;y<MAP;y++)for(let x=0;x<MAP;x++){
    let bi=0,bd=1e9;
    for(const [sx,sy,b] of seeds){
      const d=(x-sx)*(x-sx)+(y-sy)*(y-sy)+hash2(x+seed,y-seed)*260;
      if(d<bd){bd=d;bi=b}
    }
    bio[y*MAP+x]=bi;
  }
  // ---- relief : champ de hauteur (value noise 3 octaves) ----
  const H=new Float32Array(MAP*MAP);
  const oct=(fx,fy,sh)=>{ // bruit de valeur bilinéaire
    const gx=Math.floor(fx),gy=Math.floor(fy),tx=fx-gx,ty=fy-gy;
    const sm=t=>t*t*(3-2*t);
    const v=(ax,ay)=>hash2(ax+sh*97,ay-sh*57);
    const a=v(gx,gy),b=v(gx+1,gy),c2=v(gx,gy+1),d2=v(gx+1,gy+1);
    const u=sm(tx),w=sm(ty);
    return (a*(1-u)+b*u)*(1-w)+(c2*(1-u)+d2*u)*w;
  };
  for(let y=0;y<MAP;y++)for(let x=0;x<MAP;x++){
    const h=oct(x/22,y/22,1)*.62+oct(x/9,y/9,2)*.26+oct(x/4,y/4,3)*.12;
    let hv=(h-.5)*3.4;               // amplitude du relief
    const dc=Math.hypot(x-MAP/2,y-MAP/2);
    if(dc<13)hv*=Math.min(1,dc/13);  // zone de départ aplatie
    if(terr[y*MAP+x]===3)hv=2.2+h*1.6; // rempart montagneux au bord
    H[y*MAP+x]=hv;
  }
  WORLD.h=H;
  // amas de rochers (densité ~carte)
  for(let i=0;i<190;i++){
    let x=3+((rng()*(MAP-6))|0), y=3+((rng()*(MAP-6))|0);
    const n=2+(rng()*6|0);
    for(let j=0;j<n;j++){
      if(Math.abs(x-MAP/2)<7&&Math.abs(y-MAP/2)<7)break;
      if(x>2&&y>2&&x<MAP-3&&y<MAP-3)terr[y*MAP+x]=1;
      x+=(rng()*3|0)-1; y+=(rng()*3|0)-1;
    }
  }
  // arbres : densité selon le biome (attempts ~carte)
  for(let i=0;i<7000;i++){
    const x=3+((rng()*(MAP-6))|0), y=3+((rng()*(MAP-6))|0);
    const b=BIOMES[BIOME_LIST[bio[y*MAP+x]]];
    if(terr[y*MAP+x]===0&&rng()<b.density&&!(Math.abs(x-MAP/2)<6&&Math.abs(y-MAP/2)<6))terr[y*MAP+x]=2;
  }
  // troncs couchés au sol (décor, non bloquant)
  const logs=[];
  for(let i=0;i<260;i++){
    const x=3+((rng()*(MAP-6))|0), y=3+((rng()*(MAP-6))|0);
    if(terr[y*MAP+x]===0&&!dep[y*MAP+x]&&!(Math.abs(x-MAP/2)<6&&Math.abs(y-MAP/2)<6)&&rng()<.6){
      logs.push([x,y,rng()*Math.PI,BIOME_LIST[bio[y*MAP+x]]]);
    }
  }
  WORLD.logs=logs;
  // gisements : amas par marche aléatoire
  function blob(type,cx,cy,size){
    let x=Math.round(cx),y=Math.round(cy);
    for(let i=0;i<size;i++){
      if(x>2&&y>2&&x<MAP-3&&y<MAP-3&&terr[y*MAP+x]!==3){
        terr[y*MAP+x]=0; dep[y*MAP+x]=type;
      }
      const d=DIRS[rng()*4|0]; x+=d[0]; y+=d[1];
    }
  }
  const c=MAP/2;
  // zone de départ : les 4 ressources à portée
  blob('iron',  c-7+(rng()*4|0), c-3+(rng()*4|0), 28);
  blob('stone', c+5+(rng()*4|0), c-7+(rng()*4|0), 24);
  blob('coal',  c-3+(rng()*4|0), c+6+(rng()*4|0), 26);
  blob('copper',c+9+(rng()*5|0), c+8+(rng()*5|0), 26);
  // richesses lointaines, réparties sur la grande carte
  const types=['iron','copper','coal','stone'];
  for(let i=0;i<34;i++){
    const fx=.1+rng()*.8, fy=.1+rng()*.8;
    if(Math.abs(fx-.5)<.09&&Math.abs(fy-.5)<.09)continue;
    blob(types[i%4], fx*MAP, fy*MAP, 40+(rng()*26|0));
  }
  WORLD.terr=terr; WORLD.dep=dep; WORLD.bio=bio;
}
const bioAt=(x,y)=>(x<0||y<0||x>=MAP||y>=MAP)?'prairie':BIOME_LIST[WORLD.bio[y*MAP+x]];
const terrAt=(x,y)=>(x<0||y<0||x>=MAP||y>=MAP)?3:WORLD.terr[y*MAP+x];
const hTile=(x,y)=>{ // hauteur à la tuile (entiers), bornée
  if(!WORLD.h)return 0;
  x=x<0?0:x>=MAP?MAP-1:x; y=y<0?0:y>=MAP?MAP-1:y;
  return WORLD.h[y*MAP+x];
};
function groundH(fx,fy){ // hauteur lissée à une position fractionnaire (monde tuile)
  const x=fx-.5, y=fy-.5;               // centres de tuiles alignés
  const gx=Math.floor(x),gy=Math.floor(y),tx=x-gx,ty=y-gy;
  const a=hTile(gx,gy),b=hTile(gx+1,gy),c=hTile(gx,gy+1),d=hTile(gx+1,gy+1);
  return (a*(1-tx)+b*tx)*(1-ty)+(c*(1-tx)+d*tx)*ty;
}
const depAt=(x,y)=>(x<0||y<0||x>=MAP||y>=MAP)?null:WORLD.dep[y*MAP+x];
function walkable(x,y){
  const t=terrAt(x,y);
  if(t!==0)return false;
  const e=ENT_AT[key(x,y)];
  return !e||!!BUILDINGS[e.t].belt;
}

/* ---------- A* (tas binaire, adapté à la grande carte) ---------- */
function findPath(x0,y0,x1,y1){
  if(!walkable(x1,y1))return null;
  if(x0===x1&&y0===y1)return [];
  const N=MAP*MAP;
  const g=new Float32Array(N).fill(Infinity);
  const came=new Int32Array(N).fill(-1);
  const heap=[]; // [f, idx]
  const push=(f,i)=>{heap.push([f,i]);let c=heap.length-1;while(c>0){const par=(c-1)>>1;if(heap[par][0]<=heap[c][0])break;[heap[par],heap[c]]=[heap[c],heap[par]];c=par}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m}}return top};
  const h=(x,y)=>Math.abs(x-x1)+Math.abs(y-y1);
  const i0=y0*MAP+x0, i1=y1*MAP+x1;
  g[i0]=0; push(h(x0,y0),i0);
  let iter=0;
  while(heap.length&&iter++<20000){
    const [,idx]=pop();
    if(idx===i1){
      const path=[];let k=idx;
      while(k!==i0){path.push([k%MAP,(k/MAP)|0]);k=came[k]}
      return path.reverse();
    }
    const x=idx%MAP,y=(idx/MAP)|0;
    for(const d of DIRS){
      const nx=x+d[0],ny=y+d[1];
      if(!walkable(nx,ny))continue;
      const ni=ny*MAP+nx, ng=g[idx]+1;
      if(ng<g[ni]){g[ni]=ng;came[ni]=idx;push(ng+h(nx,ny),ni)}
    }
  }
  return null;
}

/* ---------- économie ---------- */
const invCount=()=>{let n=0;for(const k in S.inv)n+=S.inv[k];return n}
function invAdd(item,q){
  const room=INV_CAP(S)-invCount();
  const add=Math.max(0,Math.min(q,room));
  if(add>0)S.inv[item]=(S.inv[item]||0)+add;
  return add;
}
function invTake(item,q){
  const t=Math.min(q,S.inv[item]||0);
  if(t>0){S.inv[item]-=t;if(S.inv[item]<=0)delete S.inv[item]}
  return t;
}
function canAfford(cost){for(const k in cost)if((S.inv[k]||0)<cost[k])return false;return true}
function payCost(cost){for(const k in cost)invTake(k,cost[k])}

/* ---------- placement ---------- */
function canPlace(type,x,y,silent){
  const b=BUILDINGS[type]; if(!b)return {ok:false,why:'?'};
  if(b.rsc&&!S.rsc[b.rsc])return {ok:false,why:'Recherche requise'};
  if(terrAt(x,y)!==0)return {ok:false,why:'Terrain bloqué'};
  if(ENT_AT[key(x,y)])return {ok:false,why:'Case occupée'};
  if(Math.round(S.px-.5)===x&&Math.round(S.py-.5)===y)return {ok:false,why:'Ton robot est ici'};
  if(b.needsDeposit&&!depAt(x,y))return {ok:false,why:'Il faut un gisement'};
  if(!canAfford(b.cost))return {ok:false,why:'Ressources insuffisantes'};
  return {ok:true};
}
function placeBuilding(type,x,y,dir){
  const v=canPlace(type,x,y);
  if(!v.ok)return false;
  payCost(BUILDINGS[type].cost);
  const e={t:type,x,y,d:dir||0,inb:{},outb:{},prog:0,ri:-1};
  if(BUILDINGS[type].belt)e.items=[];
  if(BUILDINGS[type].silo)e.got={};
  S.ents.push(e); ENT_AT[key(x,y)]=e;
  S.stats.built=(S.stats.built||0)+1;
  if(BUILDINGS[type].belt)S.stats.belts=(S.stats.belts||0)+1;
  if(R3D.ready)addEntMesh(e);
  sfx('buy'); buzz(15);
  return e;
}
function demolish(e){
  const i=S.ents.indexOf(e); if(i<0)return false;
  S.ents.splice(i,1); delete ENT_AT[key(e.x,e.y)];
  for(const k in BUILDINGS[e.t].cost)invAdd(k,Math.floor(BUILDINGS[e.t].cost[k]*0.5));
  // récupère le contenu des tampons
  for(const k in e.inb)invAdd(k,e.inb[k]);
  for(const k in e.outb)invAdd(k,e.outb[k]);
  if(e.items)for(const it of e.items)invAdd(it.i,1);
  if(R3D.ready)removeEntMesh(e);
  sfx('sell'); buzz(15);
  return true;
}

/* ---------- simulation ---------- */
function accepts(e,item){
  const b=BUILDINGS[e.t];
  if(b.chest){let n=0;for(const k in e.inb)n+=e.inb[k];return n<b.cap}
  if(b.silo){const need=siloNeed(S.rockets);return need[item]&&(e.got[item]||0)<need[item]}
  if(b.recipes){
    for(const r of b.recipes)if(r.in[item])return (e.inb[item]||0)<BCAP;
  }
  return false;
}
function feed(e,item){ // dépose 1 objet dans e (suppose accepts vrai)
  const b=BUILDINGS[e.t];
  if(b.silo){e.got[item]=(e.got[item]||0)+1;return}
  e.inb[item]=(e.inb[item]||0)+1;
}
function beltEntry(e,item){ // un objet peut-il entrer sur ce convoyeur ?
  if(e.items.length>=BELT_CAP)return false;
  for(const it of e.items)if(it.p<BELT_GAP)return false;
  return true;
}
function outTotal(e){let n=0;for(const k in e.outb)n+=e.outb[k];return n}

function tick(dt){
  /* machines : production */
  for(const e of S.ents){
    const b=BUILDINGS[e.t];
    if(b.mine){ // foreuse
      const d=depAt(e.x,e.y); if(!d)continue;
      const item=DEPOSITS[d].item;
      if(outTotal(e)>=BCAP)continue;
      e.prog+=dt*speedMult('drill');
      if(e.prog>=b.mine.t){
        e.prog-=b.mine.t;
        e.outb[item]=(e.outb[item]||0)+b.mine.q;
        S.life[item]=(S.life[item]||0)+b.mine.q;
        e.anim=1;
      }
    }else if(b.recipes){
      if(e.ri<0){ // choisir une recette dont les intrants sont là
        for(let i=0;i<b.recipes.length;i++){
          const r=b.recipes[i];
          let ok=true;
          for(const k in r.in)if((e.inb[k]||0)<r.in[k]){ok=false;break}
          if(ok&&outTotal(e)+Object.values(r.out).reduce((a,v)=>a+v,0)<=BCAP+2){
            for(const k in r.in){e.inb[k]-=r.in[k];if(e.inb[k]<=0)delete e.inb[k]}
            e.ri=i; e.prog=0; break;
          }
        }
      }
      if(e.ri>=0){
        const r=b.recipes[e.ri];
        e.prog+=dt*speedMult(e.t);
        e.anim=1;
        if(e.prog>=r.t){
          for(const k in r.out){
            e.outb[k]=(e.outb[k]||0)+r.out[k];
            S.life[k]=(S.life[k]||0)+r.out[k];
          }
          if(r.sci){S.science+=r.sci;S.sciLife=(S.sciLife||0)+r.sci}
          e.ri=-1; e.prog=0;
        }
      }else e.anim=0;
    }
  }
  /* machines : déversement (toutes les 0,45 s) */
  for(const e of S.ents){
    const b=BUILDINGS[e.t];
    if(b.belt||b.silo)continue;
    e.pushT=(e.pushT||0)+dt;
    if(e.pushT<0.45)continue;
    e.pushT=0;
    const item=Object.keys(e.outb)[0];
    if(!item)continue;
    // 1) machine voisine qui en a besoin  2) convoyeur voisin  3) coffre voisin
    let target=null,belt=null,chest=null;
    for(const d of DIRS){
      const n=ENT_AT[key(e.x+d[0],e.y+d[1])];
      if(!n)continue;
      const nb=BUILDINGS[n.t];
      if(nb.belt){
        // ne pas déposer sur un convoyeur qui revient vers nous
        const bd=DIRS[n.d];
        if(n.x+bd[0]===e.x&&n.y+bd[1]===e.y)continue;
        if(beltEntry(n,item)&&!belt)belt=n;
      }
      else if(nb.chest){if(accepts(n,item)&&!chest)chest=n}
      else if(accepts(n,item)&&!target)target=n;
    }
    const dst=target||belt||chest;
    if(!dst)continue;
    e.outb[item]--; if(e.outb[item]<=0)delete e.outb[item];
    if(BUILDINGS[dst.t].belt)dst.items.push({i:item,p:0});
    else feed(dst,item);
  }
  /* convoyeurs : avancée des objets */
  const bs=beltSpeed()*dt;
  for(const e of S.ents){
    if(!e.items)continue;
    e.items.sort((a,b2)=>b2.p-a.p);
    for(let i=0;i<e.items.length;i++){
      const it=e.items[i];
      const lim=i===0?1:e.items[i-1].p-BELT_GAP;
      it.p=Math.min(it.p+bs,Math.max(lim,it.p));
      if(i===0&&it.p>=1){
        const d=DIRS[e.d];
        const n=ENT_AT[key(e.x+d[0],e.y+d[1])];
        if(n){
          const nb=BUILDINGS[n.t];
          if(nb.belt){
            if(beltEntry(n,it.i)){e.items.shift();n.items.push({i:it.i,p:0});i--}
          }else if(accepts(n,it.i)){
            e.items.shift(); feed(n,it.i); i--;
          }
        }
      }
    }
  }
}
function simulate(sec,dt){
  dt=dt||SIM_DT;
  let s=sec;
  while(s>1e-9){const step=Math.min(dt,s);tick(step);s-=step}
}

/* ---------- fusée ---------- */
function siloReady(e){
  const need=siloNeed(S.rockets);
  for(const k in need)if((e.got[k]||0)<need[k])return false;
  return true;
}
function launchRocket(e){
  if(!e||!BUILDINGS[e.t].silo||!siloReady(e))return false;
  const gained=fragGain(S.rockets);
  const keep={rockets:S.rockets+1,frags:S.frags+gained,ach:S.ach,set:S.set,stats:S.stats,quest:Math.max(S.quest,15),robot:S.robot,introDone:1};
  keep.stats.launches=(keep.stats.launches||0)+1;
  S=freshState(keep);
  ENT_AT={};
  genWorld(S.seed);
  if(R3D.ready)rebuildWorldMeshes();
  save(); sfx('rocket'); buzz(150);
  showModal('🚀 Fusée lancée !',
    `<p>Tu gagnes <b>${gained} fragments stellaires ✨</b> (+${Math.round(gained*FRAG_BONUS*100)} % de vitesse, permanent — total +${Math.round(S.frags*FRAG_BONUS*100)} %).</p>
     <p style="margin-top:6px">Ton robot repart coloniser <b>une nouvelle planète</b> : carte inédite, usine à reconstruire, coût de la prochaine fusée ×2.</p>`,
    [['Coloniser !',null]]);
  updateHUD();
  return true;
}

/* ---------- sauvegarde ---------- */
function save(){
  S.t=Date.now();
  try{
    const ents=S.ents.map(e=>{
      const o={t:e.t,x:e.x,y:e.y,d:e.d,inb:e.inb,outb:e.outb,prog:+e.prog.toFixed(3),ri:e.ri};
      if(e.items)o.items=e.items.map(it=>({i:it.i,p:+it.p.toFixed(3)}));
      if(e.got)o.got=e.got;
      return o;
    });
    localStorage.setItem(SAVE_KEY,JSON.stringify({...S,ents}));
  }catch(e){}
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(SAVE_KEY)}catch(e){}
  if(!raw)return 0;
  try{
    const d=JSON.parse(raw);
    if(!d||d.v!==3||!Array.isArray(d.ents))throw 0;
    const f=freshState();
    if(d.robot&&typeof d.robot==='object')f.robot={color:(d.robot.color|0)%6,head:(d.robot.head|0)%4};
    f.introDone=d.introDone?1:0;
    f.seed=(d.seed|0)||f.seed;
    f.science=Number.isFinite(d.science)?Math.max(0,d.science):0;
    f.sciLife=Number.isFinite(d.sciLife)?d.sciLife:0;
    if(d.rsc)for(const k in d.rsc)if(RESEARCH_BY_ID[k])f.rsc[k]=1;
    if(d.ach)for(const k in d.ach)if(ACH_BY_ID[k])f.ach[k]=1;
    if(d.inv)for(const k in d.inv)if(ITEMS[k]&&Number.isFinite(d.inv[k])&&d.inv[k]>0)f.inv[k]=Math.floor(d.inv[k]);
    if(d.life)for(const k in d.life)if(Number.isFinite(d.life[k]))f.life[k]=d.life[k];
    f.px=Number.isFinite(d.px)?Math.min(MAP-2,Math.max(2,d.px)):f.px;
    f.py=Number.isFinite(d.py)?Math.min(MAP-2,Math.max(2,d.py)):f.py;
    f.quest=Number.isInteger(d.quest)?Math.min(d.quest,QUESTS.length-1):0;
    f.rockets=Number.isInteger(d.rockets)&&d.rockets>=0?d.rockets:0;
    f.frags=Number.isFinite(d.frags)&&d.frags>=0?d.frags:0;
    if(d.set&&typeof d.set==='object')f.set={sound:d.set.sound!==false,vib:d.set.vib!==false};
    if(d.stats&&typeof d.stats==='object')f.stats={...f.stats,...d.stats};
    f.t=Number.isFinite(d.t)?d.t:Date.now();
    genWorld(f.seed);
    ENT_AT={};
    for(const o of d.ents){
      if(!BUILDINGS[o.t]||!Number.isInteger(o.x)||!Number.isInteger(o.y))continue;
      if(ENT_AT[key(o.x,o.y)])continue;
      const e={t:o.t,x:o.x,y:o.y,d:[0,1,2,3].includes(o.d)?o.d:0,
               inb:o.inb&&typeof o.inb==='object'?o.inb:{},
               outb:o.outb&&typeof o.outb==='object'?o.outb:{},
               prog:Number.isFinite(o.prog)?o.prog:0,
               ri:Number.isInteger(o.ri)?o.ri:-1};
      if(BUILDINGS[o.t].belt)e.items=Array.isArray(o.items)?o.items.filter(it=>ITEMS[it.i]&&Number.isFinite(it.p)).map(it=>({i:it.i,p:Math.min(1,Math.max(0,it.p))})):[];
      if(BUILDINGS[o.t].silo)e.got=o.got&&typeof o.got==='object'?o.got:{};
      f.ents.push(e); ENT_AT[key(e.x,e.y)]=e;
    }
    S=f;
    return f.t;
  }catch(e){return 0}
}

/* ---------- hors-ligne ---------- */
function applyOffline(elapsed){
  const capped=Math.min(elapsed,OFFLINE_CAP(S));
  if(capped<15)return;
  const before={...S.life}, sciB=S.science;
  const dt=capped>7200?0.5:0.25;
  simulate(capped,dt);
  const gains=[];
  for(const k in ITEMS){
    const d=(S.life[k]||0)-(before[k]||0);
    if(d>0.5)gains.push(`<div class="g"><span>${ITEMS[k].ic} ${ITEMS[k].n}</span><b class="num">+${fmt(d)}</b></div>`);
  }
  const dSci=S.science-sciB;
  if(dSci>0.5)gains.push(`<div class="g"><span>🧪 Science</span><b class="num">+${fmt(dSci)}</b></div>`);
  if(elapsed>=120&&gains.length){
    showModal('⏳ Pendant ton absence…',
      `<p>Ton usine a tourné pendant <b>${fmtDur(capped)}</b>${elapsed>capped+60?` (plafond hors-ligne : ${OFFLINE_CAP(S)/3600} h)`:''} :</p><div style="margin-top:8px">${gains.join('')}</div>`,
      [['Reprendre le travail',null]]);
  }
}

/* ---------- format / audio / vibrations ---------- */
const UNITS=['','k','M','Md'];
function fmt(x){
  if(!isFinite(x))return'∞';
  if(x<0)x=0;
  if(x<1000)return String(Math.floor(x));
  let u=0;while(x>=1000&&u<UNITS.length-1){x/=1000;u++}
  return (x>=100?String(Math.floor(x)):x.toFixed(1).replace('.',','))+' '+UNITS[u];
}
function fmtDur(sec){
  sec=Math.floor(sec);
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  if(h>0)return`${h} h ${String(m).padStart(2,'0')} min`;
  if(m>0)return`${m} min`;
  return`${sec} s`;
}
let AC=null,INTERACTED=false;
document.addEventListener('pointerdown',()=>{INTERACTED=true},{once:true,capture:true});
function beep(f,d,type,g,when,slide){
  const t=AC.currentTime+(when||0);
  const o=AC.createOscillator(),v=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  v.gain.setValueAtTime(g||.06,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d+.02);
}
function sfx(k){
  if(!S.set||!S.set.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    switch(k){
      case 'tap':beep(170+Math.random()*70,.06,'square',.045);break;
      case 'crit':beep(660,.08,'square',.08);beep(990,.12,'square',.07,.06);break;
      case 'buy':beep(330,.07,'triangle',.09);beep(440,.09,'triangle',.08,.05);break;
      case 'sell':beep(260,.08,'triangle',.08);beep(190,.1,'triangle',.06,.06);break;
      case 'rsc':beep(523,.1,'sine',.1);beep(784,.16,'sine',.09,.09);break;
      case 'obj':beep(523,.09,'sine',.1);beep(659,.09,'sine',.1,.08);beep(784,.18,'sine',.1,.16);break;
      case 'rocket':beep(900,.9,'sawtooth',.08,0,70);beep(60,.6,'square',.05,.15,30);break;
    }
  }catch(e){}
}
function buzz(ms){
  if(!S.set||!S.set.vib||!INTERACTED)return;
  try{
    if(window.UsineBridge&&UsineBridge.vibrate)UsineBridge.vibrate(ms);
    else if(navigator.vibrate)navigator.vibrate(ms);
  }catch(e){}
}

/* --- textures de minerai façon Satisfactory (canvas) --- */
function oreCanvas(kind){
  const S2=64, cv=document.createElement('canvas'); cv.width=cv.height=S2;
  const g=cv.getContext('2d');
  const P={
    iron:  {base:'#8a949e', dark:'#565e68', fleck:'#c4ccd4', extra:null},
    copper:{base:'#b06a3a', dark:'#7a4522', fleck:'#e8b483', oxide:'#3f9e6b', sulfur:'#c9c24a'},
    coal:  {base:'#2b2f36', dark:'#14161a', fleck:'#565d68', extra:null},
    stone: {base:'#a89e8c', dark:'#7c7263', fleck:'#c8c1b2', extra:null},
  }[kind]||{base:'#888',dark:'#555',fleck:'#bbb'};
  g.fillStyle=P.base; g.fillRect(0,0,S2,S2);
  // veines sombres
  for(let i=0;i<70;i++){g.fillStyle=P.dark;const r=1+Math.random()*2.4;g.globalAlpha=.5+Math.random()*.4;g.beginPath();g.arc(Math.random()*S2,Math.random()*S2,r,0,7);g.fill()}
  // éclats clairs (métal)
  for(let i=0;i<50;i++){g.fillStyle=P.fleck;g.globalAlpha=.4+Math.random()*.5;g.fillRect(Math.random()*S2,Math.random()*S2,1+Math.random()*1.6,1+Math.random()*1.6)}
  // cuivre : oxydation verte + soufre verdâtre
  if(kind==='copper'){
    for(let i=0;i<34;i++){g.fillStyle=P.oxide;g.globalAlpha=.25+Math.random()*.45;g.beginPath();g.arc(Math.random()*S2,Math.random()*S2,1.5+Math.random()*3.5,0,7);g.fill()}
    for(let i=0;i<18;i++){g.fillStyle=P.sulfur;g.globalAlpha=.3+Math.random()*.4;g.beginPath();g.arc(Math.random()*S2,Math.random()*S2,1+Math.random()*2,0,7);g.fill()}
  }
  g.globalAlpha=1;
  const tex=new T.CanvasTexture(cv);
  tex.colorSpace=T.SRGBColorSpace||undefined;
  return tex;
}

/* sol, gisements, décor (avec relief) */
function genGroundMeshes(scene){
  if(R3D.groundGroup)scene.remove(R3D.groundGroup);
  const g=new T.Group();
  // ---- sol : relief (vertices déplacés) + couleur par biome + texture ----
  const geo=new T.PlaneGeometry(MAP,MAP,MAP,MAP);
  geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;
  const cols=new Float32Array(pos.count*3);
  const col=new T.Color(), dirt=new T.Color(0x60523a), mnt=new T.Color(0x2b3441), tmp=new T.Color();
  for(let i=0;i<pos.count;i++){
    const wxv=pos.getX(i), wzv=pos.getZ(i);
    const tileX=Math.round(wxv+MAP/2), tileY=Math.round(wzv+MAP/2);
    const x=Math.min(MAP-1,Math.max(0,tileX)), y=Math.min(MAP-1,Math.max(0,tileY));
    pos.setY(i, groundH(wxv+MAP/2, wzv+MAP/2)); // relief lissé
    const t=terrAt(x,y), d=depAt(x,y), b=BIOMES[bioAt(x,y)];
    if(t===3)col.copy(mnt);
    else if(d)col.copy(dirt).lerp(tmp.setHex(b.ground),.25).offsetHSL(0,0,((x*7+y*13)%5)*.01);
    else col.setHex(hash2(x,y)>.5?b.ground:b.alt).offsetHSL(0,0,((x*31+y*17)%7)*.008-.02);
    cols[i*3]=col.r;cols[i*3+1]=col.g;cols[i*3+2]=col.b;
  }
  geo.setAttribute('color',new T.BufferAttribute(cols,3));
  geo.computeVertexNormals();
  g.add(new T.Mesh(geo,new T.MeshLambertMaterial({vertexColors:true,map:R3D.tex&&R3D.tex.ground})));

  // ---- rempart montagneux (posé sur le relief) ----
  const mts=[];
  for(let y=0;y<MAP;y++)for(let x=0;x<MAP;x++)if(terrAt(x,y)===3&&((x+y)%2===0))mts.push([x,y]);
  const mIn=new T.InstancedMesh(new T.BoxGeometry(1,1.6,1),mat(0x2b3441),mts.length);
  mts.forEach((p,i)=>{
    const sc=0.7+((p[0]*13+p[1]*7)%8)/8;
    const m=new T.Matrix4().makeScale(1,sc,1);
    m.setPosition(wx(p[0]),gyTile(p[0],p[1])+0.5*sc,wz(p[1]));
    mIn.setMatrixAt(i,m);
  });
  g.add(mIn);

  // ---- rochers ----
  const rocks=[];
  for(let y=0;y<MAP;y++)for(let x=0;x<MAP;x++)if(terrAt(x,y)===1)rocks.push([x,y]);
  if(rocks.length){
    const rIn=new T.InstancedMesh(new T.DodecahedronGeometry(.42),mat(0x5d6570),rocks.length);
    rocks.forEach((p,i)=>{
      const sc=.75+((p[0]*17+p[1]*5)%6)*.09;
      const m=new T.Matrix4().makeRotationY((p[0]*31+p[1])%7);
      m.premultiply(new T.Matrix4().makeScale(sc,sc,sc));
      m.setPosition(wx(p[0]),gyTile(p[0],p[1])+.28*sc,wz(p[1]));
      rIn.setMatrixAt(i,m);
    });
    g.add(rIn);
  }

  // ---- troncs couchés au sol ----
  if(WORLD.logs&&WORLD.logs.length){
    const lg=new T.CylinderGeometry(.11,.13,.9,6);
    const li=new T.InstancedMesh(lg,mat(0x5a4630),WORLD.logs.length);
    WORLD.logs.forEach((L,i)=>{
      const [x,y,ang]=L, b=BIOMES[L[3]||'prairie'];
      li.setColorAt&&li.setColorAt(i,new T.Color(b.trunk));
      const m=new T.Matrix4().makeRotationZ(Math.PI/2); // couché
      m.premultiply(new T.Matrix4().makeRotationY(ang));
      m.setPosition(wx(x),gyTile(x,y)+.12,wz(y));
      li.setMatrixAt(i,m);
    });
    if(li.instanceColor)li.instanceColor.needsUpdate=true;
    g.add(li);
  }

  // ---- arbres : un style par biome ----
  const byStyle={};
  for(let y=0;y<MAP;y++)for(let x=0;x<MAP;x++)if(terrAt(x,y)===2){
    const bk=bioAt(x,y);(byStyle[bk]=byStyle[bk]||[]).push([x,y]);
  }
  for(const bk in byStyle){
    const b=BIOMES[bk], tiles=byStyle[bk];
    const put=(im,i,p,sc,yOff)=>{const m=new T.Matrix4().makeScale(sc,sc,sc);m.setPosition(wx(p[0]),gyTile(p[0],p[1])+yOff*sc,wz(p[1]));im.setMatrixAt(i,m)};
    const trunkGeo=b.tree==='acacia'?new T.CylinderGeometry(.06,.09,.8,6):
                   b.tree==='dead'  ?new T.CylinderGeometry(.05,.09,.8,5):
                                     new T.CylinderGeometry(.07,.1,.5,6);
    const trunk=new T.InstancedMesh(trunkGeo,mat(b.trunk),tiles.length);
    let crown=null,cap=null;
    if(b.tree==='pine'||b.tree==='spruce'){
      crown=new T.InstancedMesh(new T.ConeGeometry(.38,.9,7),mat(b.leaf),tiles.length);
      if(b.tree==='spruce')cap=new T.InstancedMesh(new T.ConeGeometry(.2,.34,7),mat(0xe8eef4),tiles.length);
    }else if(b.tree==='acacia'){
      crown=new T.InstancedMesh(new T.CylinderGeometry(.5,.42,.2,8),mat(b.leaf),tiles.length);
    }else if(b.tree==='dead'){
      crown=new T.InstancedMesh(new T.CylinderGeometry(.035,.05,.4,4),mat(b.trunk),tiles.length);
    }
    tiles.forEach((p,i)=>{
      const sc=.8+((p[0]*7+p[1]*3)%5)*.1;
      put(trunk,i,p,sc,b.tree==='acacia'||b.tree==='dead'?.4:.25);
      if(b.tree==='pine'||b.tree==='spruce'){put(crown,i,p,sc,.85);if(cap)put(cap,i,p,sc,1.28)}
      else if(b.tree==='acacia')put(crown,i,p,sc,.88);
      else{
        const m=new T.Matrix4().makeRotationZ(.9);
        m.premultiply(new T.Matrix4().makeScale(sc,sc,sc));
        m.setPosition(wx(p[0])+.12*sc,gyTile(p[0],p[1])+.62*sc,wz(p[1]));
        crown.setMatrixAt(i,m);
      }
    });
    g.add(trunk);if(crown)g.add(crown);if(cap)g.add(cap);
  }

  // ---- gisements : amas de cristaux texturés (façon Satisfactory) ----
  for(const dk in DEPOSITS){
    const tiles=[];
    for(let y=0;y<MAP;y++)for(let x=0;x<MAP;x++)if(depAt(x,y)===dk)tiles.push([x,y]);
    if(!tiles.length)continue;
    const m3=new T.MeshLambertMaterial({map:R3D.tex&&R3D.tex.ore[dk],color:0xffffff});
    const im=new T.InstancedMesh(new T.OctahedronGeometry(.2,0),m3,tiles.length*3);
    let idx=0;
    tiles.forEach(p=>{
      const gh=gyTile(p[0],p[1]);
      for(let j=0;j<3;j++){
        const ox=((p[0]*13+j*29+p[1]*7)%10)/10*.6-.3, oz=((p[1]*17+j*31)%10)/10*.6-.3;
        const sc=.7+((p[0]*7+j*11+p[1])%6)*.13;
        const m=new T.Matrix4().makeRotationY(j*2.1+p[0]);
        m.premultiply(new T.Matrix4().makeScale(sc,sc*1.4,sc));
        m.setPosition(wx(p[0])+ox,gh+.12*sc,wz(p[1])+oz);
        im.setMatrixAt(idx++,m);
      }
    });
    g.add(im);
  }
  scene.add(g);
  R3D.groundGroup=g;
}

/* boucle de rendu */
let animT=0;
function renderFrame(dt){
  animT+=dt;
  if(Math.abs(R3D.zoom-R3D.zoomT)>.02){
    R3D.zoom+=(R3D.zoomT-R3D.zoom)*Math.min(1,dt*4);
    resize();
  }
  // perso posé sur le relief
  const ph=groundH(S.px,S.py);
  R3D.char.position.set(S.px-MAP/2,ph,S.py-MAP/2);
  R3D.char.rotation.y=PLAYER.face;
  R3D.char.children[0].position.y=.42+(PLAYER.moving?Math.abs(Math.sin(animT*9))*.07:0);
  if(R3D.follow){
    R3D.target.x=S.px-MAP/2; R3D.target.z=S.py-MAP/2;
    R3D.target.y+=(ph-R3D.target.y)*Math.min(1,dt*6);
  }
  camUpdate();
  // animations bâtiments
  for(const [e,m] of R3D.entMeshes){
    const p=m.userData.animPart; if(!p)continue;
    const active=e.anim||((e.ri!==undefined&&e.ri>=0)?1:0);
    switch(m.userData.animKind){
      case 'piston':p.position.y=.55+Math.sin(animT*6)* (active?.14:.02);break;
      case 'spinY':if(active)p.rotation.z+=dt*3;break;
      case 'spinX':if(active)p.rotation.x+=dt*4;break;
      case 'glow':p.material.emissiveIntensity=active?.5+Math.sin(animT*5)*.3:.12;break;
      case 'floatSpin':p.position.y=.85+Math.sin(animT*3)*.06;p.rotation.y+=dt*(active?2.5:.4);break;
    }
  }
  // objets sur convoyeurs
  const im=R3D.itemMesh;
  let idx=0;
  const M=new T.Matrix4(), C=new T.Color();
  for(const e of S.ents){
    if(!e.items||!e.items.length)continue;
    const d=DIRS[e.d], ey=gyTile(e.x,e.y);
    for(const it of e.items){
      if(idx>=600)break;
      const fx=wx(e.x)+ (it.p-.5)*d[0], fz=wz(e.y)+(it.p-.5)*d[1];
      M.makeRotationY(animT*.8);
      M.setPosition(fx,ey+.22,fz);
      im.setMatrixAt(idx,M);
      im.setColorAt(idx,C.setHex(ITEMS[it.i].col));
      idx++;
    }
  }
  im.count=idx;
  im.instanceMatrix.needsUpdate=true;
  if(im.instanceColor)im.instanceColor.needsUpdate=true;
  R3D.renderer.render(R3D.scene,R3D.cam);
}

const PLAYER={path:[],moving:false,face:0};
function tileOfPlayer(){return [Math.round(S.px-.5),Math.round(S.py-.5)]}
function goTo(tx,ty){
  const [px,py]=tileOfPlayer();
  const p=findPath(px,py,tx,ty);
  if(!p)return false;
  PLAYER.path=p;
  return true;
}
function movePlayer(dt){
  if(!PLAYER.path.length){PLAYER.moving=false;return}
  PLAYER.moving=true;
  const [tx,ty]=PLAYER.path[0];
  const gx=tx+.5, gy=ty+.5;
  const dx=gx-S.px, dy=gy-S.py;
  const dist=Math.hypot(dx,dy);
  const step=walkSpeed()*dt;
  PLAYER.face=Math.atan2(dx,dy);
  if(dist<=step){
    S.px=gx;S.py=gy;PLAYER.path.shift();
    S.stats.walked=(S.stats.walked||0)+1;
  }else{
    S.px+=dx/dist*step;S.py+=dy/dist*step;
  }
}
function nearestDeposit(){
  const [px,py]=tileOfPlayer();
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const d=depAt(px+dx,py+dy);
    if(d)return d;
  }
  return null;
}
function mineAction(){
  const d=nearestDeposit();
  if(!d)return 0;
  const item=DEPOSITS[d].item;
  let q=MINE_POW(S);
  const crit=Math.random()<0.10;
  if(crit){q*=5;S.stats.crits=(S.stats.crits||0)+1}
  const added=invAdd(item,q);
  if(added>0){
    S.life[item]=(S.life[item]||0)+added;
    S.stats.mined=(S.stats.mined||0)+added;
    sfx(crit?'crit':'tap');buzz(crit?40:12);
    floatText('+'+added+(crit?' 💥':''),crit);
  }else toast('Sac plein ! (🎒)');
  updateHUD();
  return added;
}
function floatText(txt,crit){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  if(document.querySelectorAll('.flt').length>20)return;
  const b=document.getElementById('ctxBtn').getBoundingClientRect();
  const s=document.createElement('span');
  s.className='flt'+(crit?' crit':'');s.textContent=txt;
  s.style.left=(b.left+b.width*(.2+Math.random()*.6))+'px';
  s.style.top=(b.top-8)+'px';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),950);
}

/* mode construction */
const BUILD={active:false,type:null,x:0,y:0,dir:0};
function enterBuild(type){
  BUILD.active=true;BUILD.type=type;BUILD.dir=0;
  const [px,py]=tileOfPlayer();
  BUILD.x=px+1;BUILD.y=py;
  makeGhost();
  document.getElementById('buildCtl').style.display='flex';
  document.getElementById('ctxWrap').style.display='none';
  closeSheet();
  updateGhost();
}
function exitBuild(){
  BUILD.active=false;
  if(R3D.ghost){R3D.scene.remove(R3D.ghost);R3D.ghost=null}
  document.getElementById('buildCtl').style.display='none';
  document.getElementById('ctxWrap').style.display='';
  updateHUD();
}
function makeGhost(){
  if(R3D.ghost)R3D.scene.remove(R3D.ghost);
  const g=buildMeshFor(BUILD.type,BUILD.dir);
  g.traverse(o=>{if(o.isMesh)o.material=R3D.ghostG});
  R3D.scene.add(g);R3D.ghost=g;
}
function updateGhost(){
  if(!R3D.ghost)return;
  const v=canPlace(BUILD.type,BUILD.x,BUILD.y);
  R3D.ghost.position.set(wx(BUILD.x),gyTile(BUILD.x,BUILD.y),wz(BUILD.y));
  R3D.ghost.rotation.y=-BUILD.dir*Math.PI/2;
  R3D.ghost.traverse(o=>{if(o.isMesh)o.material=v.ok?R3D.ghostG:R3D.ghostR});
  const ok=document.getElementById('bOk');
  ok.disabled=!v.ok;
  ok.textContent=v.ok?'✓ Construire':'✗ '+v.why;
}
function confirmBuild(){
  const e=placeBuilding(BUILD.type,BUILD.x,BUILD.y,BUILD.dir);
  if(!e)return;
  toast(`${BUILDINGS[BUILD.type].ic} ${BUILDINGS[BUILD.type].nm} construit${BUILDINGS[BUILD.type].nm.endsWith('e')?'e':''}`);
  // reste en mode construction si on peut encore payer (pose en série)
  if(canAfford(BUILDINGS[BUILD.type].cost)){
    if(BUILD.type==='belt'){const d=DIRS[BUILD.dir];BUILD.x+=d[0];BUILD.y+=d[1]}
    updateGhost();updateHUD();
  }else exitBuild();
}

/* entrées tactiles / souris */
function setupInput(){
  const cv=document.getElementById('c3d');
  const ptrs=new Map();
  let start=null,panning=false,pinch0=0,zoom0=0;
  const ray=new T.Raycaster(), ndc=new T.Vector2(), plane=new T.Plane(new T.Vector3(0,1,0),0), hit=new T.Vector3();
  function groundPt(cx,cy){ // point exact du sol sous le doigt (coordonnées monde)
    ndc.x=(cx/innerWidth)*2-1;ndc.y=-(cy/innerHeight)*2+1;
    ray.setFromCamera(ndc,R3D.cam);
    plane.constant=-(R3D.target?R3D.target.y:0); // plan de sol à la hauteur locale
    if(!ray.ray.intersectPlane(plane,hit))return null;
    return {x:hit.x,z:hit.z};
  }
  function groundAt(cx,cy){
    const p=groundPt(cx,cy);
    if(!p)return null;
    return [Math.floor(p.x+MAP/2),Math.floor(p.z+MAP/2)];
  }
  // sélection/déplacement : raycast sur la vraie géométrie (précis même sur le relief)
  const rp=new T.Raycaster();
  function pickTile(cx,cy){
    ndc.x=(cx/innerWidth)*2-1;ndc.y=-(cy/innerHeight)*2+1;
    rp.setFromCamera(ndc,R3D.cam);
    const targets=[];
    if(R3D.groundGroup)targets.push(R3D.groundGroup);
    for(const [,m] of R3D.entMeshes)targets.push(m);
    const hits=rp.intersectObjects(targets,true);
    if(hits.length){
      const pt=hits[0].point;
      const tx=Math.floor(pt.x+MAP/2),ty=Math.floor(pt.z+MAP/2);
      if(tx>=0&&ty>=0&&tx<MAP&&ty<MAP)return [tx,ty];
    }
    return groundAt(cx,cy);
  }
  cv.addEventListener('pointerdown',e=>{
    try{cv.setPointerCapture(e.pointerId)}catch(err){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){start={x:e.clientX,y:e.clientY,t:Date.now()};panning=false}
    else if(ptrs.size===2){
      const a=[...ptrs.values()];
      pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoom0=R3D.zoom;
    }
  });
  cv.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);if(!p)return;
    const px=p.x,py=p.y;
    p.x=e.clientX;p.y=e.clientY;
    if(ptrs.size===2){
      const a=[...ptrs.values()];
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinch0>0){R3D.zoom=R3D.zoomT=Math.min(40,Math.max(8,zoom0*pinch0/d));resize()}
      return;
    }
    if(!start)return;
    const totDx=e.clientX-start.x,totDy=e.clientY-start.y;
    if(!panning&&Math.hypot(totDx,totDy)>12)panning=true;
    if(panning){
      // le point du sol saisi reste sous le doigt : delta exact par raycast
      const g1=groundPt(px,py), g2=groundPt(e.clientX,e.clientY);
      if(g1&&g2){
        R3D.target.x-=g2.x-g1.x;
        R3D.target.z-=g2.z-g1.z;
        camUpdate();
      }
      R3D.follow=false;
      document.getElementById('recenter').style.display='block';
    }
  });
  const end=e=>{
    ptrs.delete(e.pointerId);
    if(ptrs.size>0){start=null;return}
    if(!start)return;
    const dt=Date.now()-start.t;
    const tap=!panning&&dt<450;
    const sx=start.x,sy=start.y;
    start=null;
    if(!tap)return;
    const g=pickTile(e.clientX!==undefined?e.clientX:sx,e.clientY!==undefined?e.clientY:sy);
    if(!g)return;
    const [tx,ty]=g;
    if(BUILD.active){BUILD.x=tx;BUILD.y=ty;updateGhost();return}
    const ent=ENT_AT[key(tx,ty)];
    if(ent){selectEnt(ent);return}
    hideRing();
    goTo(tx,ty);
  };
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);start=null});
  cv.addEventListener('wheel',e=>{
    R3D.zoom=R3D.zoomT=Math.min(40,Math.max(8,R3D.zoom*(e.deltaY>0?1.1:0.9)));resize();
  },{passive:true});
}
function hideRing(){R3D.ring.visible=false;R3D.selected=null}
function selectEnt(e){
  R3D.selected=e;
  R3D.ring.position.set(wx(e.x),gyTile(e.x,e.y)+.06,wz(e.y));
  R3D.ring.visible=true;
  openEntSheet(e);
}

      if(m)m.rotation.y=-e.d*Math.PI/2;
      renderEntContents(e,cnt);
    });

  }
  const db=el('button','rowbtn red','Détruire (50 % remboursé)');
  db.addEventListener('click',()=>{demolish(e);closeSheet();updateHUD()});
  body.appendChild(db);
}
function renderEntContents(e,box){
  const b=BUILDINGS[e.t];
  box.innerHTML='';
  const mk=(label,dict,takeable)=>{
    const ks=Object.keys(dict).filter(k=>dict[k]>0);
    box.appendChild(el('div','hint',label));
    if(!ks.length){box.appendChild(el('div','hint','<i>— vide —</i>'))}
    for(const k of ks){
      const row=el('div','invrow');
      row.appendChild(el('span',null,ITEMS[k].ic));
      row.appendChild(el('span','n',ITEMS[k].n));
      row.appendChild(el('b','num',String(dict[k])));
      box.appendChild(row);
    }
    if(takeable&&ks.length){
      const tb=el('button','rowbtn','🎒 Tout prendre');
      tb.addEventListener('click',()=>{
        let took=0;
        for(const k of Object.keys(dict)){
          const t=Math.min(dict[k],INV_CAP(S)-invCount());
          if(t>0){invAdd(k,t);dict[k]-=t;took+=t;if(dict[k]<=0)delete dict[k]}
        }
        toast(took>0?`+${took} objets dans le sac`:'Sac plein !');
        sfx('tap');renderEntContents(e,box);updateHUD();
      });
      box.appendChild(tb);
    }
  };
  if(b.silo){
    const need=siloNeed(S.rockets);
    box.appendChild(el('div','hint','Approvisionnement de la fusée :'));
    for(const k in need){
      const have=e.got[k]||0;
      const w=el('div',null,
        `<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:6px"><span>${ITEMS[k].ic} ${ITEMS[k].n}</span><b class="num">${fmt(have)} / ${fmt(need[k])}</b></div>
         <div class="pbar"><i style="width:${Math.min(100,have/need[k]*100)}%"></i></div>`);
      box.appendChild(w);
      if((S.inv[k]||0)>0&&have<need[k]){
        const db=el('button','rowbtn',`Déposer ${ITEMS[k].n.toLowerCase()} (${fmt(S.inv[k])})`);
        db.addEventListener('click',()=>{
          const q=Math.min(S.inv[k]||0,need[k]-(e.got[k]||0));
          invTake(k,q);e.got[k]=(e.got[k]||0)+q;
          sfx('buy');renderEntContents(e,box);updateHUD();
          const lb=document.getElementById('launchBtn');
          if(lb)lb.disabled=!siloReady(e);
        });
        box.appendChild(db);
      }
    }
    return;
  }
  if(b.belt){
    box.appendChild(el('div','hint',`Objets sur le tapis : ${e.items.length}/${BELT_CAP} — direction : ${['→ est','↓ sud','← ouest','↑ nord'][e.d]}`));
    return;
  }
  if(b.chest){mk('Contenu :',e.inb,true);return}
  if(b.mine){mk('Production (récupère ou laisse les voisins se servir) :',e.outb,true);return}
  // machine à recettes
  mk('Entrées :',e.inb,false);
  // boutons de dépôt pour chaque ingrédient
  const wants={};
  for(const r of b.recipes)for(const k in r.in)wants[k]=1;
  for(const k in wants){
    if((S.inv[k]||0)>0&&(e.inb[k]||0)<BCAP){
      const db=el('button','rowbtn',`Déposer ${ITEMS[k].n.toLowerCase()} (${fmt(S.inv[k])} en sac)`);
      db.addEventListener('click',()=>{
        const q=Math.min(S.inv[k]||0,BCAP-(e.inb[k]||0));
        invTake(k,q);e.inb[k]=(e.inb[k]||0)+q;
        sfx('buy');renderEntContents(e,box);updateHUD();
      });
      box.appendChild(db);
    }
  }
  mk('Sorties :',e.outb,true);
}

    showModal('Tout effacer ?','Toute ta progression (fragments ✨ compris) sera définitivement supprimée.',
      [['Annuler',null,true],['Tout effacer',()=>{
        try{localStorage.removeItem(SAVE_KEY)}catch(e){}
        S=freshState();ENT_AT={};genWorld(S.seed);rebuildWorldMeshes();closeSheet();updateHUD();toast('Nouvelle partie');
      }]]);
  });
  sv.appendChild(rz);
  body.appendChild(sv);
}

/* --- HUD / boucle UI --- */
const BIOME_UI={prairie:['🌿','Prairie'],savane:['🌾','Savane'],neige:['❄️','Neige'],badlands:['🏜️','Badlands']};
function updateHUD(){
  $('hudSci').textContent=fmt(S.science);
  $('hudInv').textContent=fmt(invCount());
  const fill=Math.min(1,invCount()/INV_CAP(S));
  const bg=$('bagGauge');
  bg.style.setProperty('--p',(fill*100).toFixed(1));
  bg.classList.toggle('full',fill>=.999);
  if(S.frags>0){$('hudFrag').style.display='';$('hudFragN').textContent=S.frags}
  // biome courant
  const bk=bioAt(Math.round(S.px-.5),Math.round(S.py-.5)), bu=BIOME_UI[bk]||BIOME_UI.prairie;
  $('biomeIc').textContent=bu[0]; $('biomeNm').textContent=bu[1];
  $('questTx').textContent=(S.quest<QUESTS.length?QUESTS[S.quest].tx:'');
  $('questN').textContent=`${Math.min(S.quest+1,QUESTS.length-1)}/${QUESTS.length-1}`;
  $('questFill').style.width=Math.min(100,S.quest/(QUESTS.length-1)*100)+'%';
  // bouton contextuel
  const d=nearestDeposit();
  const ctx=$('ctxBtn');
  if(d&&!BUILD.active){ctx.style.display='block';ctx.textContent=`⛏️ Miner (${ITEMS[DEPOSITS[d].item].n.split(' ').pop()})`}
  else ctx.style.display='none';
  // pastille recherche
  let av=false;
  for(const r of RESEARCH)if(!S.rsc[r.id]&&(!r.req||S.rsc[r.req])&&S.science>=r.cost)av=true;
  $('rscDot').classList.toggle('show',av);
}
function slowUpdate(){
  // quêtes
  if(S.quest<QUESTS.length-1&&QUESTS[S.quest].ok(S)){
    const q=QUESTS[S.quest];
    for(const k in q.rw)invAdd(k,q.rw[k]);
    S.quest++;
    sfx('obj');buzz(30);
    toast('✅ Objectif atteint !'+(Object.keys(q.rw).length?' Récompense reçue':''));
  }
  // succès
  for(const a of ACHIEVEMENTS){
    if(!S.ach[a.id]&&a.ok(S)){
      S.ach[a.id]=1;
      toast(`🏆 Succès : ${a.nm} (+2 %)`);sfx('obj');buzz(30);
    }
  }
  // rafraîchit la feuille entité ouverte
  if(SHEET==='ent'&&R3D.selected){
    const box=document.getElementById('entContents');
    if(box)renderEntContents(R3D.selected,box);
    const lb=document.getElementById('launchBtn');
    if(lb)lb.disabled=!siloReady(R3D.selected);
  }
  if(SHEET==='rsc'){/* les boutons se mettent à jour à la réouverture */}
  updateHUD();
}

/* --- modal / toast --- */
function showModal(title,html,btns){
  $('modalTitle').textContent=title;
  $('modalBody').innerHTML=html;
  const box=$('modalBtns');box.innerHTML='';
  for(const [label,fn,ghost] of btns){
    const b=el('button',ghost?'ghost':'',label);
    b.addEventListener('click',()=>{$('modalBack').classList.remove('show');if(fn)fn()});
    box.appendChild(b);
  }
  $('modalBack').classList.add('show');
}
let toastTimer=null;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1900);
}

/* =====================================================================
   BOUCLE PRINCIPALE & DÉMARRAGE
   ===================================================================== */
let lastT=Date.now(), acc=0, slowAcc=0;
function frame(){
  requestAnimationFrame(frame);
  const now=Date.now();
  let dt=(now-lastT)/1000;
  lastT=now;
  if(dt<=0)return;
  if(dt>60){applyOffline(dt);dt=0.016}
  dt=Math.min(dt,0.25);
  S.stats.playTime=(S.stats.playTime||0)+dt;
  acc+=dt;
  while(acc>=SIM_DT){tick(SIM_DT);acc-=SIM_DT}
  movePlayer(dt);
  slowAcc+=dt;
  if(slowAcc>=0.5){slowAcc=0;slowUpdate()}
  if(R3D.ready)renderFrame(dt);
}

function init(){
  const savedAt=load();
  if(!savedAt)genWorld(S.seed);
  if(!initRender())return;
  setupInput();
  if(savedAt){
    const elapsed=(Date.now()-savedAt)/1000;
    if(elapsed>15)applyOffline(elapsed);
  }
  $('ctxBtn').addEventListener('pointerdown',e=>{e.preventDefault();mineAction()});
  $('btnGuide').addEventListener('click',()=>SHEET==='guide'?closeSheet():openGuideSheet());
  $('quest').addEventListener('click',()=>SHEET==='guide'?closeSheet():openGuideSheet());
  $('recenter').addEventListener('click',()=>{R3D.follow=true;$('recenter').style.display='none'});
  $('tbBuild').addEventListener('click',()=>{if(BUILD.active)exitBuild();SHEET==='build'?closeSheet():openBuildSheet()});
  $('tbInv').addEventListener('click',()=>SHEET==='inv'?closeSheet():openInvSheet());
  $('tbRsc').addEventListener('click',()=>SHEET==='rsc'?closeSheet():openRscSheet());
  $('tbMenu').addEventListener('click',()=>SHEET==='menu'?closeSheet():openMenuSheet());
  $('sheetClose').addEventListener('click',closeSheet);
  $('sheetBack').addEventListener('pointerdown',closeSheet);
  $('bOk').addEventListener('click',confirmBuild);
  $('bRot').addEventListener('click',()=>{BUILD.dir=(BUILD.dir+1)%4;updateGhost()});
  $('bCancel').addEventListener('click',exitBuild);
  setInterval(save,10000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else lastT=Date.now()});
  window.addEventListener('pagehide',save);
  applyRobot();
  if(!S.introDone)showIntro();
  updateHUD();
  frame();
  if('serviceWorker' in navigator&&location.protocol==='https:'){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
}
init();
