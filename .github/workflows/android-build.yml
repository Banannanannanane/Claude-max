name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK (non signé)
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename artifacts
        run: |
          mkdir -p dist
          # APK installable directement (signée avec la clé debug d'Android).
          cp app/build/outputs/apk/debug/app-debug.apk dist/mammouth.apk
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" dist/mammouth-release-non-signe.apk
          fi
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mammouth-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Release toujours à jour, téléchargeable sans compte GitHub.
      - name: Publier l'APK en release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK Mammouth (dernière version)
          body: |
            APK compilée automatiquement depuis la branche `${{ github.ref_name }}`.

            **Téléchargez `mammouth.apk`** ci-dessous et installez-la sur votre téléphone
            (Android demandera d'autoriser l'installation depuis cette source).

            Commit : ${{ github.sha }}
          files: dist/mammouth.apk
          prerelease: false
          make_latest: true

      - name: Publier la release versionnée (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
