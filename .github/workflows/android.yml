name: Android

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1
  GODOT: ${{ github.workspace }}/godot-bin/Godot_v4.5.1-stable_linux.x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot et modèles d'export
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Installer Godot et les modèles d'export
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot-bin
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          curl -sSfL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm -rf godot.zip templates.tpz tpl

      - name: Configurer le SDK Android pour Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          cat ~/.config/godot/editor_settings-4.5.tres

      - name: Importer le projet
        working-directory: game
        run: $GODOT --headless --import

      - name: Tests de logique du jeu
        working-directory: game
        run: $GODOT --headless -- --qa=logic

      # Signature : les secrets du dépôt (clé de publication Play Store) si présents,
      # sinon la clé de test du dépôt (installable sur un téléphone, pas pour le Store).
      - name: Préparer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEYSTORE_USER" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
          else
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$GITHUB_WORKSPACE/keystore/trouvelefoin.jks" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=trouvelefoin" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=foinfoin" >> $GITHUB_ENV
          fi

      - name: Exporter l'APK
        working-directory: game
        run: |
          mkdir -p ../build
          $GODOT --headless --export-release "Android" ../build/TrouveLeFoin.apk
          ls -la ../build

      - name: Exporter l'AAB (Google Play)
        working-directory: game
        run: |
          $GODOT --headless --install-android-build-template
          $GODOT --headless --export-release "Android AAB" ../build/TrouveLeFoin.aab
          ls -la ../build

      - uses: actions/upload-artifact@v4
        with:
          name: TrouveLeFoin-android
          path: |
            build/TrouveLeFoin.apk
            build/TrouveLeFoin.aab
          if-no-files-found: error

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: Trouve le Foin 3D (build ${{ github.run_number }})
          make_latest: true
          body: |
            **Trouve le Foin**, le jeu 3D : trouve les 22 brins de foin cachés dans des tas d'aiguilles, puis automatise ta ferme.

            - `TrouveLeFoin.apk` : à télécharger sur le téléphone puis ouvrir (autoriser l'installation d'applis inconnues).
            - `TrouveLeFoin.aab` : le paquet à envoyer sur la Google Play Console.
          files: |
            build/TrouveLeFoin.apk
            build/TrouveLeFoin.aab
