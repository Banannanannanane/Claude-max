name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Vide quand le dépôt n'a pas de secrets de signature.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      # Signature optionnelle : sans les secrets, le build release retombe sur
      # la clé de debug (voir app/android/app/build.gradle.kts), suffisante pour
      # installer l'APK sur un téléphone mais pas pour publier.
      - name: Restore upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > key.properties

      # Deux applications, deux identifiants : elles s'installent côte à côte.
      - name: Build Ça Part (APK)
        working-directory: app
        run: flutter build apk --release --flavor prod --dart-define=FLAVOR=prod

      - name: Build Ça Part test (APK)
        working-directory: app
        run: flutter build apk --release --flavor dev --dart-define=FLAVOR=dev

      - name: Build Ça Part (App Bundle)
        working-directory: app
        run: flutter build appbundle --release --flavor prod --dart-define=FLAVOR=prod

      - uses: actions/upload-artifact@v4
        with:
          name: ca-part-apk
          path: app/build/app/outputs/flutter-apk/app-prod-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ca-part-test-apk
          path: app/build/app/outputs/flutter-apk/app-dev-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ca-part-aab
          path: app/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          if-no-files-found: error
