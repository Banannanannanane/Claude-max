name: APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests
        run: ./gradlew :engine:test --no-daemon

      - name: Build the APK
        run: ./gradlew :app:assembleDebug --no-daemon

      # The point of the whole workflow: a file that can be side-loaded straight
      # onto a phone, downloadable from this run's summary page.
      - name: Publish the APK
        uses: actions/upload-artifact@v4
        with:
          name: taskbar-hero-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: engine/build/reports/tests/test
          if-no-files-found: ignore
