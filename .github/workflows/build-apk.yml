name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compiler l'APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/TrouveLeFoin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TrouveLeFoin-apk
          path: out/TrouveLeFoin.apk

      - name: Publier une release téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Trouve le Foin (build ${{ github.run_number }})
          body: |
            APK Android de **Trouve le Foin**. Téléchargez `TrouveLeFoin.apk` sur votre téléphone,
            puis ouvrez-le (autorisez l'installation depuis des sources inconnues si demandé).
          files: out/TrouveLeFoin.apk
          make_latest: true
